###########################################################################
# Anisotropic Blast-Wave (Retiere & Lisa, PRC 70, 044907 (2004))
# Defaults: "non-round" source of RL Table I, except T, which is raised to
# a chemical-freeze-out value because THERMINATOR adds resonance decays.
# Reaction plane = x-z. Ry > Rx : out-of-plane extended source.
###########################################################################

# Range of Y - eta sampled [units]
RapPSRange = 8.0
# Space-time rapidity range [units]
RapSRange = 12.0

# In-plane / out-of-plane radius [fm]
Rx = 11.0
Ry = 13.0
# Surface diffuseness a_s (0 = box profile, ~0.3 = Gaussian-like) [units]
SurfaceDiff = 0.0

# Mean freeze-out proper time and Gaussian emission duration [fm]
# DeltaTau = 0 gives a sharp tau = Tau0 hypersurface
Tau0 = 8.17
DeltaTau = 0.

# Transverse flow rapidity: rho = rt^FlowPower * (Rho0 + Rho2 cos 2 phi_b)
# FlowPower = 1 is RL; FlowPower = 0 with Rx = Ry, Rho2 = 0 reproduces BlastWave
Rho0 = 0.8
Rho2 = 0.05
FlowPower = 1

# Temperature and chemical potentials [MeV]
# Placeholders: copy the values from your fomodel/blastwave.ini.
# Rho0 = 0.9 is RL's T = 100 MeV, no-resonance value; at T ~ 165 MeV with
# feed-down you will want a smaller Rho0 to keep realistic spectra.
Temperature = 155.0
MuB = 0
MuI = 0
MuS = 0
MuC =  0.0
